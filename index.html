<style>
:root {
  --bg: #f4f6f3;

  --tx: #141c19;

  --pri: #0f6e66;
  --pri-hover: #0b534d;
  --pri-light: #e6f4f2;
  --sec: #e76f51;
  --err: #c5221f;
  --err-bg: #fdf2f2;
  --accent: #2a9d8f;
  --radius: 10px;
}
[data-theme="dark"] {
  --bg: #0f1413;
  --card: #18201e;
  --card-border: #283532;
  --tx: #eaf0ed;
  --tx-mut: #8e9e98;
  --pri: #2da89d;
  --pri-hover: #228b81;
  --pri-light: #162b28;
  --sec: #f4a261;
  --err: #f28b82;
  --err-bg: #2d1817;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.5;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 40;
  background: var(--card);
  border-bottom: 1px solid var(--card-border);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--pri); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.btn-icon {
  background: transparent; border: 1px solid var(--card-border); border-radius: 8px;

.main-layout {
  max-width: 1200px; margin: 0 auto; padding: 18px 14px 60px;

@media (min-width: 900px) {

  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);

input[type=number], input[type=text], select {

html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

<script>
const PALETTE = ['#2a9d8f','#e76f51','#f4a261','#457b9d','#9b5de5','#00bbf9','#06d6a0','#ff006e','#118ab2'];
let rows = [];
const newRow = () => ({ label: '', qty: 1, l: 0, w: 0, canRotate: true });

let isArabic = true, curUnit = "mm";
const UF = { mm: 1, cm: 10, in: 25.4 };
const fmt = v => +(+v).toFixed(2);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

// خوارزمية القص المستقيم (Guillotine): كل قصة من طرف لطرف، تنفع منشار الشيتات
class Bin {
  constructor(w, h, k, split) { this.w = w; this.h = h; this.k = k; this.split = split; this.free = [[0, 0, w, h]]; this.placed = []; this.cutLen = 0; }
  find(pw, ph, canRot) {
    let best = null;
    const ori = [[pw, ph, false]];
    if (canRot && pw !== ph) ori.push([ph, pw, true]);
    this.free.forEach(([x, y, fw, fh], i) => {
      for (const [a, b, rot] of ori) {
        if (a <= fw + 1e-7 && b <= fh + 1e-7) {
          const s1 = Math.min(fw - a, fh - b), s2 = Math.max(fw - a, fh - b);
          if (!best || s1 < best.s1 - 1e-9 || (Math.abs(s1 - best.s1) < 1e-9 && s2 < best.s2)) best = { s1, s2, i, x, y, a, b, rot };
        }
      }
    });
    return best;
  }
  place(f, item) {
    const { i, x, y, a, b, rot } = f;
    const [, , fw, fh] = this.free[i];
    this.placed.push({ x, y, w: a - this.k, h: b - this.k, label: item.label, color: item.color, rot, ol: item.l, ow: item.w });
    this.free.splice(i, 1);
    const rw = fw - a, rh = fh - b, E = 1e-6;
    const horiz = this.split === 0 ? rw < rh : rw >= rh;
    let r1, r2;
    if (horiz) {
      r1 = [x + a, y, rw, b]; r2 = [x, y + b, fw, rh];
      if (rh > E) this.cutLen += fw; if (rw > E) this.cutLen += b;
    } else {
      r1 = [x + a, y, rw, fh]; r2 = [x, y + b, a, rh];
      if (rw > E) this.cutLen += fh; if (rh > E) this.cutLen += a;
    }
    [r1, r2].forEach(r => { if (r[2] > E && r[3] > E) this.free.push(r); });
  }
}

function pack(items, W, H, k, rot, split) {
  const bins = [];
  for (const it of items) {
    const pw = it.l + k, ph = it.w + k, cr = rot && it.canRotate;
    let done = false;
    for (const b of bins) { const f = b.find(pw, ph, cr); if (f) { b.place(f, it); done = true; break; } }
    if (!done) { const b = new Bin(W + k, H + k, k, split); const f = b.find(pw, ph, cr); if (f) { b.place(f, it); bins.push(b); } }
  }
  return bins;
}

function rng(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// الأقل في عدد الشيتات أولاً، ثم أكبر فراغ مجمّع في آخر شيت (بقايا نافعة)
function score(bins) {
  const last = bins[bins.length - 1];
  return bins.length * 1e12 + (last ? last.placed.reduce((s, p) => s + p.w * p.h, 0) : 0);
}

function optimize(items, W, H, k, rot) {
  const keys = [a => a.l * a.w, a => Math.max(a.l, a.w), a => a.l + a.w, a => a.l, a => a.w];
  const rand = rng(12345);
  let best = null, bs = Infinity;
  const tryOrder = (arr, split) => { const bins = pack(arr, W, H, k, rot, split); const sc = score(bins); if (sc < bs) { bs = sc; best = bins; } };
  for (const kf of keys) for (const sp of [0, 1]) tryOrder([...items].sort((a, b) => kf(b) - kf(a)), sp);
  for (let n = 0; n < 200; n++) {
    const kf = keys[n % keys.length];
    const arr = items.map(it => ({ it, v: kf(it) * (1 + (rand() - 0.5) * 0.5) })).sort((a, b) => b.v - a.v).map(o => o.it);
    tryOrder(arr, n % 2);
  }
  return best || [];
}

const EN = {'تقطيع الشيتات · CutOptimizer':'CutOptimizer 2D','مقاس الشيت (اللوح الخام)':'Stock Sheet Dimensions','الطول (L)':'Length (L)','العرض (W)':'Width (W)','سمك المنشار (سلاح القص)':'Blade Kerf','هوامش التنظيف (Trim)':'Trim Margin','السماح بتدوير القطع':'Allow Piece Rotation','القطعيات المطلوبة':'Cut List','+ إضافة مقاس جديد':'+ Add Part','⚡ احسب وارسم الشيت':'⚡ Calculate & Nest','مم (mm)':'mm','سم (cm)':'cm','بوصة (in)':'inch','صاج 2000×1000':'Metal 2000×1000','صاج 3000×1500':'Metal 3000×1500','الاسم':'Name','العدد':'Qty','الطول':'Length','العرض':'Width','تدوير':'Rotate','حذف':'Del','🖨️ طباعة':'🖨️ Print','+ نموذج مطبخ':'+ Kitchen sample','عدد الشيتات':'Sheets','نسبة الاستغلال':'Yield','نسبة الهدر':'Waste','طول القص':'Cut length','المدخلات':'Input','النتائج':'Results','احسب':'Calculate','مسح الكل':'Clear all','🗑️ مسح الكل':'🗑️ Clear all','لا توجد نتائج بعد':'No results yet','أدخل مقاس الشيت والقطعيات وسيظهر الرسم هنا تلقائياً':'Enter the sheet size and parts to see the layout here'};
function applyLang() {
  document.querySelectorAll("body *").forEach(el => {
    if (el.children.length) return;
    const t = el.dataset.ar || el.textContent.trim();
    if (EN[t]) { el.dataset.ar = t; el.textContent = isArabic ? t : EN[t]; }
  });
}

function drawSheetCanvas(bin, W, H, trim, k, unit) {
  const S = Math.min(850 / W, 500 / H);
  const pad = 24;
  const cv = document.createElement("canvas");
  const dw = Math.round(W * S) + pad * 2;
  const dh = Math.round(H * S) + pad * 2;
  const dpr = window.devicePixelRatio || 1;

  cv.width = dw * dpr; cv.height = dh * dpr;
  cv.style.width = dw + "px"; cv.style.height = dh + "px";

  const c = cv.getContext("2d");
  c.scale(dpr, dpr);

  // خلفية الشيت
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, dw, dh);
  c.fillStyle = "#ebedea"; c.fillRect(pad, pad, W * S, H * S);

  c.save(); c.beginPath(); c.rect(pad, pad, W * S, H * S); c.clip();
  c.strokeStyle = "#d4d8d2"; c.lineWidth = 1;
  for (let d = -H * S; d < W * S; d += 15) {
    c.beginPath(); c.moveTo(pad + d, pad + H * S); c.lineTo(pad + d + H * S, pad); c.stroke();
  }
  c.restore();

  if (trim > 0) {
    c.strokeStyle = "#e11d48"; c.lineWidth = 1; c.setLineDash([3, 3]);
    c.strokeRect(pad + trim * S, pad + trim * S, (W - trim * 2) * S, (H - trim * 2) * S);
    c.setLineDash([]);
  }

  let usedArea = 0;
  bin.placed.forEach((p) => {
    const px = pad + (p.x + trim) * S;
    const py = pad + (p.y + trim) * S;
    const pw = p.w * S;
    const ph = p.h * S;
    usedArea += p.w * p.h;

    c.fillStyle = p.color; c.fillRect(px, py, pw, ph);
    c.strokeStyle = "#1b2521"; c.lineWidth = 1.2; c.strokeRect(px, py, pw, ph);

    const dim = `${p.ol}×${p.ow}` + (p.rot ? " ↻" : "");
    const tall = ph > pw * 1.35;
    const fs = Math.min(16, (tall ? ph : pw) / (dim.length * 0.65), (tall ? pw : ph) * 0.4);

    if (fs >= 7) {
      c.save(); c.translate(px + pw / 2, py + ph / 2);
      if (tall) c.rotate(-Math.PI / 2);
      c.fillStyle = "#111"; c.textAlign = "center"; c.textBaseline = "middle";

      if (p.label && fs >= 9 && (tall ? pw : ph) >= 25) {
        c.font = `700 ${fs * 0.8}px system-ui, sans-serif`;
        c.fillText(p.label, 0, -fs * 0.55);
        c.font = `600 ${fs * 0.75}px monospace`;
        c.fillText(dim, 0, fs * 0.55);
      } else {
        c.font = `700 ${fs}px monospace`;
        c.fillText(dim, 0, 0);
      }
      c.restore();
    }
  });

  c.strokeStyle = "#111"; c.lineWidth = 2.5; c.strokeRect(pad, pad, W * S, H * S);
  c.fillStyle = "#4b5563"; c.font = "600 11px system-ui, sans-serif"; c.textAlign = "center";
  c.fillText(`${W} ${unit}`, pad + (W * S) / 2, pad - 6);

  return { cv, usedArea };
}

function renderRows() {
  const container = document.getElementById("rowsContainer");
  container.innerHTML = "";
  if (!rows.length) { container.innerHTML = `<div class="empty-hint">${isArabic ? 'لا توجد قطع. اضغط "+ إضافة مقاس جديد".' : 'No parts yet. Tap "+ Add Part".'}</div>`; return; }
  rows.forEach((r, idx) => {
    const el = document.createElement("div");
    el.className = "cutlist-row";
    el.innerHTML = `
      <input type="text" value="${esc(r.label)}" placeholder="${isArabic?'الاسم':'Name'}" oninput="rows[${idx}].label=this.value">
      <input type="number" value="${r.qty}" min="1" oninput="rows[${idx}].qty=Math.max(1,parseInt(this.value)||1)">
      <input type="number" value="${r.l}" min="1" step="any" oninput="rows[${idx}].l=parseFloat(this.value)||0">
      <input type="number" value="${r.w}" min="1" step="any" oninput="rows[${idx}].w=parseFloat(this.value)||0">
      <button class="btn-canRotate ${r.canRotate?'':'locked'}" type="button" title="${r.canRotate?(isArabic?'تدوير حر':'Free rotate'):(isArabic?'ثابت الاتجاه':'Fixed')}" onclick="rows[${idx}].canRotate=!rows[${idx}].canRotate;renderRows();autoCalc()">${r.canRotate?'🔄':'🔒'}</button>
      <button class="btn-del" type="button" onclick="deleteRow(${idx})">✕</button>
    `;
    container.appendChild(el);
  });
}

function addRow() {
  rows.push({ ...newRow(), label: `${isArabic ? "قطعة" : "Part"} ${rows.length + 1}` });
  renderRows();
  const f = document.querySelector('#rowsContainer .cutlist-row:last-child input:nth-child(3)'); if (f) f.focus();
}

function deleteRow(idx) {
  rows.splice(idx, 1);
  renderRows();
  autoCalc();
}

function setSheet(w, h) {
  document.getElementById("sheetW").value = fmt(w / UF[curUnit]);
  document.getElementById("sheetH").value = fmt(h / UF[curUnit]);
  autoCalc();
}

function loadSample(type) {
  if (type === 'kitchen') {
    setSheet(2440, 1220);
    rows = [
      { label: 'باب خزانة', qty: 4, l: 720, w: 450, canRotate: false },
      { label: 'جوانب', qty: 2, l: 850, w: 560, canRotate: false },
      { label: 'قاعدة وسقف', qty: 2, l: 900, w: 560, canRotate: true },
      { label: 'أرفف داخلية', qty: 3, l: 864, w: 530, canRotate: true },
      { label: 'درج أمامي', qty: 4, l: 446, w: 176, canRotate: true }
    ];
    rows.forEach(r => { r.l = fmt(r.l / UF[curUnit]); r.w = fmt(r.w / UF[curUnit]); });
    renderRows();
    calculate();
  }
}

function calculate(manual) {
  const err = document.getElementById("errorBox");
  err.style.display = "none";
  const num = id => parseFloat(document.getElementById(id).value) || 0;

  const W = num("sheetW"), H = num("sheetH"), k = num("kerf"), trim = num("trim");
  const allowRot = document.getElementById("rotGlobal").checked;
  const unit = document.getElementById("unitSel").value;

  if (W <= 0 || H <= 0) {
    err.textContent = isArabic ? "يرجى كتابة مقاسات اللوح الخام." : "Enter sheet dimensions.";
    clearResults();
    if (manual) err.style.display = "block";
    return;
  }

  const usableW = Math.max(0, W - trim * 2);
  const usableH = Math.max(0, H - trim * 2);

  const flatItems = [], tooBig = [];
  rows.forEach((r, idx) => {
    if (r.l > 0 && r.w > 0 && r.qty > 0) {
      const color = PALETTE[idx % PALETTE.length];
      const fitsNormal = r.l <= usableW && r.w <= usableH;
      const fitsRot = allowRot && r.canRotate && r.w <= usableW && r.l <= usableH;

      if (!fitsNormal && !fitsRot) {
        tooBig.push(r.label); return;
      }

      for (let i = 0; i < r.qty; i++) {
        flatItems.push({ label: r.label, l: r.l, w: r.w, canRotate: r.canRotate, color });
      }
    }
  });

  if (tooBig.length) {
    err.textContent = (isArabic ? "قطع أكبر من اللوح المتاح (تم تجاهلها): " : "Parts exceed usable area (ignored): ") + tooBig.join(", ");
    err.style.display = "block";
  }
  if (!flatItems.length) {
    clearResults();
    if (manual && !tooBig.length) { err.textContent = isArabic ? "أضف قطعة واحدة على الأقل بأبعاد صحيحة." : "Add at least one part."; err.style.display = "block"; }
    return;
  }

  const bins = optimize(flatItems, usableW, usableH, k, allowRot);
  const out = document.getElementById("sheetsOutput");
  out.innerHTML = "";

  let totalUsed = 0;
  let totalCutLen = 0;

  bins.forEach((b, i) => {
    const card = document.createElement("div");
    card.className = "sheet-diagram-card";

    const { cv, usedArea } = drawSheetCanvas(b, W, H, trim, k, unit);
    totalUsed += usedArea;

    let sheetCutLen = 0;
    sheetCutLen = b.cutLen;
    totalCutLen += sheetCutLen;

    const yieldPct = ((usedArea / (W * H)) * 100).toFixed(1);

    card.innerHTML = `
      <div class="sheet-header">
        <h3>${isArabic ? 'شيت' : 'Sheet'} ${i + 1} ${isArabic ? 'من' : 'of'} ${bins.length} — ${isArabic ? 'استغلال' : 'Yield'}: ${yieldPct}%</h3>
        <button class="btn-icon no-print" onclick="downloadCanvas(this)">💾 ${isArabic ? 'حفظ الصورة' : 'Save Image'}</button>
      </div>
      <div class="canvas-wrapper"></div>
    `;
    card.querySelector(".canvas-wrapper").appendChild(cv);
    out.appendChild(card);
  });

  document.getElementById("statsGrid").style.display = "grid";
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("statSheets").textContent = bins.length;
  const overallYield = bins.length > 0 ? (totalUsed / (bins.length * W * H)) * 100 : 0;
  document.getElementById("statYield").textContent = overallYield.toFixed(1) + "%";
  document.getElementById("statWaste").textContent = (100 - overallYield).toFixed(1) + "%";

  const cutMeters = unit === 'mm' ? (totalCutLen / 1000).toFixed(1) : unit === 'cm' ? (totalCutLen / 100).toFixed(1) : (totalCutLen * 0.0254).toFixed(1);
  document.getElementById("statCuts").textContent = cutMeters + (isArabic ? ' م' : ' m');
  if (manual === true) setTab('out');
}

function downloadCanvas(btn) {
  const cv = btn.closest(".sheet-diagram-card").querySelector("canvas");
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = `sheet-cutting-layout.png`;
  a.click();
}

document.getElementById("btnLang").onclick = () => {
  isArabic = !isArabic;
  document.documentElement.dir = isArabic ? "rtl" : "ltr";
  document.documentElement.lang = isArabic ? "ar" : "en";
  document.getElementById("btnLang").textContent = isArabic ? "English" : "العربية";
  applyLang(); renderRows(); calculate();
};

document.getElementById("btnTheme").onclick = () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("btnTheme").textContent = isDark ? "🌙" : "☀️";
};

document.getElementById("btnAddRow").onclick = addRow;
document.getElementById("btnRun").onclick = () => calculate(true);

document.getElementById("unitSel").onchange = function () {
  const f = UF[curUnit] / UF[this.value];
  ["sheetW", "sheetH", "kerf", "trim"].forEach(id => { const e = document.getElementById(id); e.value = fmt((parseFloat(e.value) || 0) * f); });
  rows.forEach(r => { r.l = fmt(r.l * f); r.w = fmt(r.w * f); });
  curUnit = this.value;
  renderRows(); calculate();
};

function clearResults() {
  document.getElementById("sheetsOutput").innerHTML = "";
  document.getElementById("statsGrid").style.display = "none";
  document.getElementById("emptyState").style.display = "";
}
let _t;
function autoCalc() { clearTimeout(_t); _t = setTimeout(() => calculate(false), 350); }
function setTab(t) {
  document.body.dataset.tab = t;
  document.getElementById("tabIn").classList.toggle("on", t === "in");
  document.getElementById("tabOut").classList.toggle("on", t === "out");
  window.scrollTo(0, 0);
}
function resetAll() {
  if (!confirm(isArabic ? "مسح كل البيانات وبدء مشروع جديد؟" : "Clear all data and start a new project?")) return;
  rows = [];
  ["sheetW", "sheetH", "kerf", "trim"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("rotGlobal").checked = true;
  document.getElementById("errorBox").style.display = "none";
  renderRows(); clearResults(); setTab("in");
}
document.addEventListener("input", e => { if (e.target.closest(".left-col")) autoCalc(); });
document.getElementById("btnClear").onclick = document.getElementById("tabClear").onclick = resetAll;
document.getElementById("tabRun").onclick = () => calculate(true);
document.getElementById("tabIn").onclick = () => setTab("in");
document.getElementById("tabOut").onclick = () => setTab("out");

renderRows(); clearResults(); setTab("in");
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
